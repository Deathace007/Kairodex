[project]
name = "kairodex"
version = "0.1.0"
description = "AI-assisted options-buying paper trading research platform"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "httpx>=0.28",
  "websockets>=14.1",
  "structlog>=24.4",
  "typer>=0.15",
  "polars>=1.17",
  "numpy>=2.1",
  "redis>=5.2",
  "pyyaml>=6.0.2",
  "tenacity>=9.0",
  "apscheduler>=3.11",
  "lse-data>=0.14.0",
  "protobuf>=7.35.1",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
  "ruff>=0.8",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "testcontainers[postgres]>=4.9",
  "import-linter>=2.1",
  "grpcio-tools>=1.83.0",
  "types-protobuf>=7.34.1.20260518",
  "types-pyyaml>=6.0.12.20260724",
  "py-vollib>=1.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kairodex"]

[project.scripts]
kairodex = "kairodex.cli:app"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions", "**/*_pb2.py", "**/*_pb2.pyi"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Typer's Option()/Argument() defaults are call-in-default by design.
"src/kairodex/cli.py" = ["B008"]
# FastAPI's Depends()/Query() defaults are the same call-in-default
# pattern, equally by design (FastAPI's own DI resolves them per-request).
"src/kairodex/api/**" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["_pb2\\.pyi?$"]

[[tool.mypy.overrides]]
# No py.typed marker upstream (apscheduler 3.x) — not a code issue to fix here.
module = "apscheduler.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.importlinter]
root_package = "kairodex"
# Required for the "Optuna stays out..." contract below, whose forbidden
# module (`optuna`) is external to `kairodex` — found via the same P6
# `lint-imports` crash that also caught `kairodex/strategy`'s missing
# `__init__.py`; without this, import-linter refuses to even start
# ("must have include_external_packages=True when there are external
# forbidden modules"), so this contract had never actually run either.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "API is glue, not business logic"
type = "forbidden"
source_modules = ["kairodex.api"]
forbidden_modules = ["kairodex.strategy", "kairodex.risk", "kairodex.engine", "kairodex.backtest"]

[[tool.importlinter.contracts]]
name = "Optuna stays out of the live trading path"
type = "forbidden"
source_modules = ["kairodex.engine", "kairodex.strategy", "kairodex.risk", "kairodex.execution"]
forbidden_modules = ["optuna"]
