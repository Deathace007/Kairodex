# Per-segment risk config (ARCHITECTURE.md §11). capital/base_risk_pct/
# hard_ceiling_pct/max_premium_pct are exactly the doc's own table — the
# rest (daily/weekly loss limits, drawdown, exposure cap, liquidity floor,
# re-entry cooldown) aren't given exact numbers in the doc ("config, not
# hardcoded" is the instruction, not a value) — these are round, first-pass,
# documented defaults, freely adjustable, not derived from any formula.
capital: 50000
currency: INR
base_risk_pct: 0.08
hard_ceiling_pct: 0.35
max_premium_pct: 0.35
max_concurrent: 2
# 5 -> 2 on 2026-09-15, user's call (was 1 -> 5 on 2026-08-06). With real
# F&O lot sizes (PROGRESS.md §26) the per-slot budget exposure_cap_pct x
# equity / max_concurrent was ~Rs 4,572 at 5 and no watchlist name's
# near-ATM lot fit (cheapest ITC Rs 6,081). At 2 the slot is ~Rs 11,430 and
# 11 of 20 names fit on 09-15 prices; the rest reject NO_TRADE_MIN_SIZE.
daily_loss_limit_pct: 0.16
weekly_loss_limit_pct: 0.30
max_drawdown_pct: 0.40
exposure_cap_pct: 0.40
min_liquidity_score: 0.3
# 30 -> 45 on 2026-08-14, to match `scratch_exit_after_minutes` below.
#
# The two numbers were inconsistent and the inconsistency was expensive: the
# system held that 45 minutes is long enough to conclude a trade is not
# working, and that 30 minutes is long enough to forget about it.
#
# BHARTIARTL, 2026-08-14, one underlying in one session: 1980 CE won (+49.5%,
# 1 lot, +Rs 192), then 2020 CE stopped out (-21.4%, 17 lots, -Rs 1,593),
# then the SAME 2020 CE leg in the SAME direction stopped out again (-29.0%,
# 17 lots, -Rs 2,029). Net -Rs 3,430. Trade 82 closed 12:42:08 and trade 84
# opened 13:14:17 — 32 minutes and 9 seconds, clearing the old gate by two
# minutes. ITC was traded three times the same day (put, put, call) for
# -Rs 505; RELIANCE 1300 PE was scratched on 08-13 and bought again on 08-14.
#
# This is the other half of §17's fix. That session corrected the gate's
# SYMMETRY (a winning close populated nothing, so TCS re-entered on the next
# tick and lost Rs 4,343). What was left uncorrected is its DURATION.
reentry_cooldown_minutes: 45

# A VOLUME THROTTLE, not a quality filter. Read this before moving it.
#
# `backtest.backfill` has now answered the question §17 left open, and the
# answer is that confidence has NEGATIVE predictive value. Over 19,729
# nse_stock signals resolved against their own forward bars, against a
# 33.3% no-edge baseline:
#
#   all signals    31.8% target hit
#   conf >= 0.60   29.5%
#   conf >= 0.80   20.2%
#
# Confirmed OUT-OF-SAMPLE on the independent 08-13 session (n=1,019):
# 0.60-0.80 -> 23.1%, >= 0.80 -> 14.3%. Every filter on this quantity makes
# the forward outcome worse, monotonically. The mechanism (PROGRESS.md §17d)
# is that confidence is monotone in *extension*, so the scorer is most
# certain exactly where an intraday move is most stretched — an extension
# meter, not an edge estimate.
#
# So this number does not select good trades and cannot be made to. What it
# still does, and what it is kept for, is cap how many evaluations reach the
# risk gates per session. That is worth having: at zero edge, more trades is
# just more theta and more spread.
#
# RE-SITED ONCE on 2026-08-14, 0.60 -> 0.51, for one reason only: unwiring
# `iv_skew_sentiment` shifted the confidence distribution down (p75 0.5609 ->
# 0.5115 over the 1,335 recorded 08-13 evaluations), and 0.51 holds the SAME
# 20.4% pass rate the old gate had. Throttle maintenance after a scorer
# change, not a quality judgement.
#
# THE WEEKLY p75 RE-SITING RITUAL IS RETIRED. It was fitting a threshold to
# a meter now twice-confirmed to point the wrong way, and it cost a session
# of work each time. Move this number only when the scorer itself changes,
# and then only to preserve the pass rate.
min_confidence: 0.51

# --- P7 hardening (2026-08-10), all derived from the first ten closed
# trades and the 33k signals behind them. See PROGRESS.md §15.

# No entries in the opening minutes: 11 of 13 NSE entries ever taken fell
# in the first 20 minutes, and they are where the losses are — the
# intraday features they score on (ATR, VWAP, opening range, volume
# profile, price acceptance) have no session history to read yet.
entry_warmup_minutes: 45
# 20 -> 45 on 2026-09-15: entries 09:35-10:00 lost Rs 9,462 on 43 trades
# (negative in 9 of 11 real sessions, both halves of the sample). Not a
# direction problem — signals in that window resolve no worse — but noise:
# -4.1% average drawdown in the first 10 minutes vs 0.0% for 10:00 entries,
# and 5 of the book's 6 stop-outs inside 20 minutes.

# Theta guard in trading sessions, not calendar days. The old 3-calendar-
# day guard killed four positions at Monday's 09:17-09:19 opening bell
# having given them only two real sessions.
max_holding_sessions: 3

# Leave a position that has had time to work and hasn't.
#
# 90 -> 45 on 2026-08-14. The rule is the single most valuable one in the
# system: replaying the 24 trades closed since the 08-11 reset with it
# REMOVED and everything else held gives -Rs 8,614 against -Rs 3,002 with
# it, so it is worth +Rs 5,612 as it stands. But it fires late. Its
# threshold is +8% MFE and the median trade's MFE is +8.0% — it was
# deciding at a coin flip. Ten of the 24 peaked within 15 minutes at a
# trivial level and then bled for another 75 before the rule released
# them. Every (stop x scratch) cell tested improves at 45 minutes.
#
# The +8% threshold is deliberately unchanged: 45 minutes is the knob the
# evidence speaks to, and moving both at once would leave neither
# attributable. Re-measure the threshold separately.
scratch_exit_after_minutes: 15
scratch_exit_min_mfe_pct: 0.03
# 45/0.08 -> 15/0.03 on 2026-09-15 — the separate threshold measurement the
# note above deferred. Trades below +3% at 15 min (n=63) reached a best-ever
# +3.1% and lost Rs 26,685; those above (n=69) reached +23.8% and made
# Rs 22,510. Replay over 159 trades: +Rs 7,078 (+4,734 without the best
# trade), positive in both halves; every 10-30 min x 2-3% cell helps.

# No new entries this close to the bell. Everything is intraday (user's
# call, 2026-08-10: nothing held overnight), so a trade opened with less
# runway than it needs to work just pays both spreads. Matches the scratch
# window, from the same evidence: every winner reached +10% within 82
# session-minutes.
entry_cutoff_minutes: 90

# --- 2026-09-15 fix plan (docs/reports/2026-09-15-two-segment-audit-and-fix-plan.html)
# Veto: the 11 trades admitted at >= 0.90 lost Rs 8,318 (both halves).
# min_confidence above stays a volume throttle; this is the only
# confidence rule with evidence behind it. Re-check once relative_strength
# is back — its absence is what made >= 0.95 common.
max_confidence: 0.90
# Once +10%, the stop may not fall below entry. The proportional 20% trail
# alone returned 19 trades that peaked >= +15% to <= +5% (-Rs 6,124).
breakeven_trigger_pct: 0.10
breakeven_floor_pct: 0.0
