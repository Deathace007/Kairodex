max_premium_pct: 0.35
max_concurrent: 5  # user's call, 2026-08-06 (was 1)
daily_loss_limit_pct: 0.16
weekly_loss_limit_pct: 0.30
max_drawdown_pct: 0.40
exposure_cap_pct: 0.40
min_liquidity_score: 0.3
reentry_cooldown_minutes: 30
