# Per-segment risk config (ARCHITECTURE.md §11). capital/base_risk_pct/
# hard_ceiling_pct/max_premium_pct are exactly the doc's own table — the
# rest (daily/weekly loss limits, drawdown, exposure cap, liquidity floor,
# re-entry cooldown) aren't given exact numbers in the doc ("config, not
# hardcoded" is the instruction, not a value) — these are round, first-pass,
# documented defaults, freely adjustable, not derived from any formula.
capital: 50000
currency: INR
base_risk_pct: 0.08
hard_ceiling_pct: 0.35
max_premium_pct: 0.35
max_concurrent: 5  # user's call, 2026-08-06 (was 1)
daily_loss_limit_pct: 0.16
weekly_loss_limit_pct: 0.30
max_drawdown_pct: 0.40
exposure_cap_pct: 0.40
min_liquidity_score: 0.3
reentry_cooldown_minutes: 30

# Minimum confluence score to spend a concurrent slot on, set at this
# segment's OWN p75. RECALIBRATED 2026-08-11 (was 0.35) — mandatory, not
# optional: §16's trend_structure rescale and the 0.20 agreement threshold
# both move the confidence distribution, so the old 0.35 (p75 of the OLD
# distribution) would have passed nearly everything. New p75 = 0.7117,
# measured by replaying all 18,977 real nse_stock signals through the new
# scorer. Still a percentile of a live distribution, NOT an outcome-fitted
# number — no closed trade under the current ruleset exists yet to fit against
# (all 15 prior NSE trades are pre-hardening; 14 would now be gate-rejected).
min_confidence: 0.71

# --- P7 hardening (2026-08-10), all derived from the first ten closed
# trades and the 33k signals behind them. See PROGRESS.md §15.

# No entries in the opening minutes: 11 of 13 NSE entries ever taken fell
# in the first 20 minutes, and they are where the losses are — the
# intraday features they score on (ATR, VWAP, opening range, volume
# profile, price acceptance) have no session history to read yet.
entry_warmup_minutes: 20

# Theta guard in trading sessions, not calendar days. The old 3-calendar-
# day guard killed four positions at Monday's 09:17-09:19 opening bell
# having given them only two real sessions.
max_holding_sessions: 3

# Every closed trade that ever reached +10% did so within 82 session-
# minutes; the four that never worked at all (best excursion +0.7%,
# +2.3%, +0.2%, -5.0%) rode to a -30% stop for 92% of all losses.
scratch_exit_after_minutes: 90
scratch_exit_min_mfe_pct: 0.08

# No new entries this close to the bell. Everything is intraday (user's
# call, 2026-08-10: nothing held overnight), so a trade opened with less
# runway than it needs to work just pays both spreads. Matches the scratch
# window, from the same evidence: every winner reached +10% within 82
# session-minutes.
entry_cutoff_minutes: 90
