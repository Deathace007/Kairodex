capital: 50000
currency: INR
base_risk_pct: 0.07
hard_ceiling_pct: 0.25
max_premium_pct: 0.35
max_concurrent: 2
daily_loss_limit_pct: 0.14
weekly_loss_limit_pct: 0.28
max_drawdown_pct: 0.35
exposure_cap_pct: 0.30
min_liquidity_score: 0.3
# 30 -> 45 on 2026-08-14, to match `scratch_exit_after_minutes` below.
#
# The two numbers were inconsistent and the inconsistency was expensive: the
# system held that 45 minutes is long enough to conclude a trade is not
# working, and that 30 minutes is long enough to forget about it.
#
# BHARTIARTL, 2026-08-14, one underlying in one session: 1980 CE won (+49.5%,
# 1 lot, +Rs 192), then 2020 CE stopped out (-21.4%, 17 lots, -Rs 1,593),
# then the SAME 2020 CE leg in the SAME direction stopped out again (-29.0%,
# 17 lots, -Rs 2,029). Net -Rs 3,430. Trade 82 closed 12:42:08 and trade 84
# opened 13:14:17 — 32 minutes and 9 seconds, clearing the old gate by two
# minutes. ITC was traded three times the same day (put, put, call) for
# -Rs 505; RELIANCE 1300 PE was scratched on 08-13 and bought again on 08-14.
#
# This is the other half of §17's fix. That session corrected the gate's
# SYMMETRY (a winning close populated nothing, so TCS re-entered on the next
# tick and lost Rs 4,343). What was left uncorrected is its DURATION.
reentry_cooldown_minutes: 45

# A VOLUME THROTTLE, not a quality filter — see nse_stock.yaml for the
# forward-outcome evidence that confidence is anti-predictive, and for why
# the weekly p75 re-siting ritual is retired.
#
# DELIBERATELY NOT RE-SITED on 2026-08-14, while nse_stock moved 0.60 ->
# 0.51. Unwiring `iv_skew_sentiment` hits this segment much harder than
# nse_stock, and the sample here cannot support fitting a new number:
#
#   - only 30 evaluations were recorded on 08-13, of which 11 still produce
#     a direction once VOLATILITY is dropped;
#   - `iv_skew` was voting on 29 of those 30 (97%), so it had been carrying
#     most of this segment's confluence — with zero measured information;
#   - `relative_strength` reads above the 0.20 agreement threshold on 0 of
#     30, so this segment is now effectively 2-of-2: structure and flow must
#     agree unanimously.
#
# Leaving the gate at 0.61 on top of a 2-of-2 requirement makes nse_index
# markedly quieter. That is the conservative direction and it is intended:
# four closed nse_index trades since the 08-11 reset are -Rs 1,616 net, so
# trading less here costs nothing that has been demonstrated. Fitting 0.294
# (the pass-rate-preserving value) on 30 rows would be noise-fitting.
#
# WATCH THIS: if nse_index goes silent for a full week, that is the signal
# to re-measure on a real sample — not a bug to chase.
min_confidence: 0.61

# --- P7 hardening (2026-08-10), all derived from the first ten closed
# trades and the 33k signals behind them. See PROGRESS.md §15.

# No entries in the opening minutes: 11 of 13 NSE entries ever taken fell
# in the first 20 minutes, and they are where the losses are — the
# intraday features they score on (ATR, VWAP, opening range, volume
# profile, price acceptance) have no session history to read yet.
entry_warmup_minutes: 20

# Theta guard in trading sessions, not calendar days. The old 3-calendar-
# day guard killed four positions at Monday's 09:17-09:19 opening bell
# having given them only two real sessions.
max_holding_sessions: 3

# Leave a position that has had time to work and hasn't. 90 -> 45 on
# 2026-08-14 — see nse_stock.yaml for the measurement. The evidence is
# almost entirely nse_stock's (4 nse_index trades in the sample), and the
# window is kept in step across both NSE segments deliberately rather
# than fitted twice on samples that cannot support it.
scratch_exit_after_minutes: 45
scratch_exit_min_mfe_pct: 0.08

# No new entries this close to the bell. Everything is intraday (user's
# call, 2026-08-10: nothing held overnight), so a trade opened with less
# runway than it needs to work just pays both spreads. Matches the scratch
# window, from the same evidence: every winner reached +10% within 82
# session-minutes.
entry_cutoff_minutes: 90
