# T1 watchlist (ARCHITECTURE.md §6) — ~20 underlyings/segment, 60s cadence,
# full chain (2 expiries x ~40 strikes x 2). Symbols are matched against
# `instruments.symbol` after `kairodex ingest sync-instruments` has run for
# that market — this file only lists tickers, not vendor keys.
#
# This is a proposed default (liquid F&O / most-traded names), not a
# strategy decision — edit freely before `kairodex ingest sync-watchlist`.
#
# Verified against a live sync-instruments pull on the VM, 2026-08-04:
# TATAMOTORS is no longer a listed NSE symbol as of this session's live
# instrument master (superseded by its 2025 demerger); Bank Nifty's real
# trading_symbol is "BANKNIFTY", not "Nifty Bank".

nse_index:
  - "Nifty 50"
  - BANKNIFTY

nse_stock:
  - RELIANCE
  - HDFCBANK
  - ICICIBANK
  - INFY
  - TCS
  - SBIN
  - AXISBANK
  - KOTAKBANK
  - LT
  - BHARTIARTL
  - ITC
  - HINDUNILVR
  - BAJFINANCE
  - MARUTI
  - M&M
  - SUNPHARMA
  - TATASTEEL
  - ADANIENT
  - WIPRO
  - ONGC

# ADR 0007: LSE's options catalog (3,186 underlyings, verified live) has no
# SPX/NDX/RUT at all — index-option data isn't offered by this vendor.
# User's decision: trade index-tracking ETF options instead — S&P 500
# (SPY), NASDAQ 100 (QQQ), Dow Jones (DIA), Russell 2000 (IWM). Real ETF
# shares, not index values, priced/risk-managed on the same American-style
# physically-settled path as us_stock — see the ADR for why that matters.
# Must NOT also appear in us_stock: the same option-leg rows would have
# their `segment` column overwritten depending on watchlist iteration order.
us_index:
  - SPY
  - QQQ
  - DIA
  - IWM

us_stock:
  - AAPL
  - MSFT
  - NVDA
  - AMZN
  - GOOGL
  - META
  - TSLA
  - AMD
  - NFLX
  - JPM
  - XOM
  - BAC
  - WMT
  - DIS
  - INTC
  - CRM
  - ORCL
  - COST
